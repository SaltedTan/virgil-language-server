name: Editor test suites

# The weekly editor tests workflow runs all jobs in one call. The release
# workflow calls the required and JVM preview jobs separately. Both test the
# files of the run that calls this workflow: the archives in
# its archive-x86-64-linux, archive-x86-64-darwin, and archive-jvm-arm64-darwin
# artifacts and the VSIX in
# its vsix-<target> artifacts, never building the server or packaging the VSIX again.
# They run a clean README install in an Ubuntu container, the LazyVim test on
# Linux with Neovim 0.11 and 0.12 and on macOS,
# the Extension Host test on macOS on the installed VSIX, and the same suite
# through VS Code Remote-SSH on Linux. On macOS, the LazyVim and Extension Host
# tests run twice: on the x86-64-darwin build under Rosetta 2, and on the JVM
# build for Apple Silicon (the jvm-arm64-darwin archive and darwin-arm64-jvm
# VSIX) on a runner with Rosetta 2 installed. test/jvm/native.py rejects
# translation in every observed descendant and checks that every Java process
# runs the bundled runtime's arm64 java. The LazyVim test installs the pinned
# starter and plugins from GitHub, and the Remote-SSH test VS Code, Remote-SSH,
# and the VS Code Server from Microsoft, without a cache. Each job uploads its
# results and logs, also when it fails. The LazyVim, Extension Host, and
# Remote-SSH jobs also write and validate a result stream (test/e2e/RESULTS.md),
# which is in the same artifact; a missing or invalid stream fails the job. See
# test/e2e/lazyvim/README.md#ci, clients/vscode/README.md#remote-ssh-test, and
# docs/manual-testing.md for coverage.

on:
  workflow_call:
    inputs:
      version:
        description: The server version in the archives' names, virgil-lsp-<version>-<target>.tar.gz
        type: string
        required: true
      lanes:
        description: >-
          Editor lanes to run: all, required (the release gates), or jvm
          (the two advisory JVM preview editor tests).
        type: string
        default: all

permissions:
  contents: read

# The result streams' purpose and release. The github context is the caller's,
# and only the release workflow runs on a pushed tag, so that is the published
# release's run. Every other run, a dry run or the weekly run, is development
# and names no release: between releases, VERSION still names the last
# published one.
env:
  RESULTS_PURPOSE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || 'development' }}
  RESULTS_RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && inputs.version || '' }}

# No concurrency group: these jobs run in the caller's run, under the caller's
# group, so that a release run and a weekly run never wait for or cancel each
# other.

jobs:
  clean-install-bundle:
    if: inputs.lanes == 'all' || inputs.lanes == 'required'
    name: Bundle the README install test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Bundle only the READMEs, public editor configs, and standalone drivers
        run: |
          python3 test/e2e/clean-install/run.py bundle "$RUNNER_TEMP/clean-install"
          tar -czf "$RUNNER_TEMP/clean-install.tar.gz" -C "$RUNNER_TEMP/clean-install" .
      - uses: actions/upload-artifact@v7
        with:
          name: clean-install-bundle
          path: ${{ runner.temp }}/clean-install.tar.gz
          if-no-files-found: error

  clean-install-linux:
    if: inputs.lanes == 'all' || inputs.lanes == 'required'
    name: Clean README install (Linux, archive and VSIX)
    needs: clean-install-bundle
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # No checkout here, and no repository or Virgil checkout in the bundle.
      - uses: actions/download-artifact@v8
        with:
          name: clean-install-bundle
          path: /opt/install-bundle
      - uses: actions/download-artifact@v8
        with:
          name: archive-x86-64-linux
          path: /opt/install-assets
      - uses: actions/download-artifact@v8
        with:
          name: vsix-linux-x64
          path: /opt/install-assets
      - uses: actions/download-artifact@v8
        with:
          name: checksum-x86-64-linux
          path: /opt/install-checksum
      - name: Install only the named prerequisites in the fresh container
        run: |
          tar -xzf /opt/install-bundle/clean-install.tar.gz -C /opt/install-bundle
          bash /opt/install-bundle/prerequisites.sh container
          mkdir /opt/empty-home
          useradd --create-home --skel /opt/empty-home --shell /bin/bash installer
      - name: Follow the READMEs as a non-root user with an empty home
        run: |
          read -r VSIX_SHA256 VSIX < /opt/install-assets/linux-x64.sha256
          cd /home/installer
          runuser -u installer -- env -i HOME=/home/installer PATH=/usr/local/bin:/usr/bin:/bin \
            python3 /opt/install-bundle/run.py run --bundle /opt/install-bundle \
            --assets /opt/install-assets --archive-sha256 /opt/install-checksum/archive.sha256 \
            --vsix-sha256 "$VSIX_SHA256" --version "$VERSION" --vsix "$VSIX" \
            --out /home/installer/results
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: clean-install-linux
          path: |
            /home/installer/results/*/run.log
            /home/installer/results/*/run.sh
            /home/installer/results/*/*.json
            /home/installer/results/*/.config/Code/logs/
            /home/installer/results/*/.local/state/nvim/lsp.log
            /home/installer/results/public/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: ${{ job.status == 'failure' && 'warn' || 'ignore' }}
          retention-days: 30

  lazyvim-linux:
    if: inputs.lanes == 'all' || inputs.lanes == 'required'
    name: LazyVim test (archive, linux, Neovim ${{ matrix.nvim }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - nvim: 0.11.6
            sha256: 2fc90b962327f73a78afbfb8203fd19db8db9cdf4ee5e2bef84704339add89cc
          - nvim: 0.12.6
            sha256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
    env:
      NVIM_VERSION: ${{ matrix.nvim }}
      NVIM_SHA256: ${{ matrix.sha256 }}
      ARCHIVE: virgil-lsp-${{ inputs.version }}-x86-64-linux.tar.gz
    steps:
      # The test's fixture project uses the pinned Virgil checkout's libraries.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Neovim ${{ matrix.nvim }}
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/v$NVIM_VERSION/nvim-linux-x86_64.tar.gz" \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "$NVIM_SHA256  $RUNNER_TEMP/nvim.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends tmux
          fi
      - name: Show versions
        run: |
          sed -n 's/^PRETTY_NAME=//p' /etc/os-release
          nvim --version | head -n 1
          tmux -V
      - uses: actions/download-artifact@v8
        with:
          name: archive-x86-64-linux
          path: ${{ runner.temp }}/archive
      - name: LazyVim test against the archive
        # The test's provenance, in the log and the results, records the
        # archive's SHA-256.
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/lazyvim"
          results=(--results "$RUNNER_TEMP/lazyvim/lazyvim.jsonl" --purpose "$RESULTS_PURPOSE")
          [[ -z $RESULTS_RELEASE ]] || results+=(--release "$RESULTS_RELEASE")
          test/e2e/lazyvim/run.sh --out "$RUNNER_TEMP/lazyvim/results" --archive "$RUNNER_TEMP/archive/$ARCHIVE" \
            "${results[@]}" 2>&1 | tee "$RUNNER_TEMP/lazyvim/run.log"
      - name: Validate the LazyVim result stream
        # Prints the stream's verdict in the log, and fails the job when the
        # stream is missing or invalid (status 2), since a run without valid
        # evidence isn't a pass. A valid stream of a run that didn't pass
        # (status 1) only repeats the test step's failure.
        if: always()
        run: python3 scripts/editor-results.py validate "$RUNNER_TEMP/lazyvim/lazyvim.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lazyvim-linux-nvim-${{ matrix.nvim }}
          path: ${{ runner.temp }}/lazyvim
          if-no-files-found: warn
          retention-days: 30

  vscode-remote-ssh-linux:
    # VS Code with Microsoft's Remote-SSH extension connects to this runner
    # through an SSH server of the test's own on 127.0.0.1, installs the VSIX
    # there, and runs the Extension Host suite in the remote extension host
    # with the bundled Linux server, three times. The artifact holds the
    # test's logs, manifest, and result stream, never Microsoft's downloads or
    # the test's keys.
    if: inputs.lanes == 'all' || inputs.lanes == 'required'
    name: VS Code Remote-SSH test (bundled VSIX, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install an SSH server and Xvfb if missing
        # The test starts its own SSH server; it never uses or changes the
        # runner's.
        run: |
          packages=()
          [[ -x /usr/sbin/sshd ]] || packages+=(openssh-server)
          command -v Xvfb >/dev/null || packages+=(xvfb)
          if (( ${#packages[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "${packages[@]}"
          fi
      - name: Create the SSH server's privilege separation directory if missing
        # OpenSSH 9.6 may refuse to start without it, even as the runner's
        # user. The runner's SSH service creates it only when it runs.
        run: |
          [[ -d /run/sshd ]] || sudo install -d -m 0755 /run/sshd
      - uses: actions/download-artifact@v8
        with:
          name: vsix-linux-x64
          path: ${{ runner.temp }}/vsix
      - name: Check that the VSIX is the packaged one
        run: |
          cd "$RUNNER_TEMP/vsix"
          sha256sum --check --strict linux-x64.sha256
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Show versions
        run: |
          sed -n 's/^PRETTY_NAME=//p' /etc/os-release
          node --version
          ssh -V
          command -v Xvfb
          grep -m 1 "VSCODE_VERSION = " clients/vscode/test/e2e/run.cjs
          grep -m 1 "id: 'ms-vscode-remote.remote-ssh'," clients/vscode/test/e2e/remote-ssh/run.cjs
      - name: Install client dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Remote-SSH test against the bundled VSIX
        working-directory: clients/vscode
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/remote-ssh"
          results=(--results "$RUNNER_TEMP/remote-ssh/remote-ssh.jsonl" --purpose "$RESULTS_PURPOSE")
          [[ -z $RESULTS_RELEASE ]] || results+=(--release "$RESULTS_RELEASE")
          npm run test:e2e:remote-ssh -- --vsix "$RUNNER_TEMP"/vsix/*.vsix --bundled \
            --repeat 3 --out "$RUNNER_TEMP/remote-ssh/results" "${results[@]}" 2>&1 |
            tee "$RUNNER_TEMP/remote-ssh/run.log"
      - name: Validate the Remote-SSH result stream
        # Prints the stream's verdict in the log, and fails the job when the
        # stream is missing or invalid (status 2), since a run without valid
        # evidence isn't a pass. A valid stream of a run that didn't pass
        # (status 1) only repeats the test step's failure.
        if: always()
        run: python3 scripts/editor-results.py validate "$RUNNER_TEMP/remote-ssh/remote-ssh.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-remote-ssh-linux
          path: ${{ runner.temp }}/remote-ssh
          if-no-files-found: warn
          retention-days: 30

  lazyvim-macos:
    # Apple Silicon runs the x86-64-darwin build under Rosetta 2 until Virgil
    # supports arm64-darwin (ADR-0003).
    if: inputs.lanes == 'all' || inputs.lanes == 'required'
    name: LazyVim test (archive, macOS Apple Silicon via Rosetta 2, Neovim 0.12.6)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      NVIM_VERSION: 0.12.6
      NVIM_SHA256: 1dbd148222b051ba6c307c4d17a318ed083df018a4f6a5a0ce46955ffc9ab87b
      ARCHIVE: virgil-lsp-${{ inputs.version }}-x86-64-darwin.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Install Neovim ${{ env.NVIM_VERSION }}
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/v$NVIM_VERSION/nvim-macos-arm64.tar.gz" \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "$NVIM_SHA256  $RUNNER_TEMP/nvim.tar.gz" | shasum -a 256 --check --strict
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-macos-arm64/bin" >> "$GITHUB_PATH"
      - name: Install tmux (Homebrew)
        run: brew install tmux
      - name: Show versions
        run: |
          sw_vers
          uname -sm
          nvim --version | head -n 1
          tmux -V
      - uses: actions/download-artifact@v8
        with:
          name: archive-x86-64-darwin
          path: ${{ runner.temp }}/archive
      - name: LazyVim test against the archive
        # The test's provenance, in the log and the results, records the
        # archive's SHA-256.
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/lazyvim"
          results=(--results "$RUNNER_TEMP/lazyvim/lazyvim.jsonl" --purpose "$RESULTS_PURPOSE")
          [[ -z $RESULTS_RELEASE ]] || results+=(--release "$RESULTS_RELEASE")
          test/e2e/lazyvim/run.sh --out "$RUNNER_TEMP/lazyvim/results" --archive "$RUNNER_TEMP/archive/$ARCHIVE" \
            "${results[@]}" 2>&1 | tee "$RUNNER_TEMP/lazyvim/run.log"
      - name: Validate the LazyVim result stream
        # Prints the stream's verdict in the log, and fails the job when the
        # stream is missing or invalid (status 2), since a run without valid
        # evidence isn't a pass. A valid stream of a run that didn't pass
        # (status 1) only repeats the test step's failure.
        if: always()
        run: python3 scripts/editor-results.py validate "$RUNNER_TEMP/lazyvim/lazyvim.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lazyvim-macos
          path: ${{ runner.temp }}/lazyvim
          if-no-files-found: warn
          retention-days: 30

  vscode-vsix-macos:
    # CI runs the Extension Host test on macOS only on the extension from
    # source; this job runs it on the installed platform VSIX and its bundle.
    # macOS needs no virtual display.
    # The artifact holds the test's output and, if a launch failed, that
    # launch's VS Code logs.
    if: inputs.lanes == 'all' || inputs.lanes == 'required'
    name: VS Code Extension Host test (bundled VSIX, macOS Apple Silicon via Rosetta 2)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/download-artifact@v8
        with:
          name: vsix-darwin-arm64
          path: ${{ runner.temp }}/vsix
      - name: Check the producer digest
        run: |
          cd "$RUNNER_TEMP/vsix"
          shasum -a 256 --check --strict darwin-arm64.sha256
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Show versions
        run: |
          sw_vers
          uname -sm
          node --version
          grep -m 1 "VSCODE_VERSION = " clients/vscode/test/e2e/run.cjs
      - name: Install client dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Extension Host test against the installed VSIX
        working-directory: clients/vscode
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/vscode"
          results=(--results "$RUNNER_TEMP/vscode/vscode.jsonl" --purpose "$RESULTS_PURPOSE")
          [[ -z $RESULTS_RELEASE ]] || results+=(--release "$RESULTS_RELEASE")
          npm run test:e2e -- --vsix "$RUNNER_TEMP"/vsix/*.vsix --logs "$RUNNER_TEMP/vscode/logs" "${results[@]}" 2>&1 |
            tee "$RUNNER_TEMP/vscode/test.log"
      - name: Validate the Extension Host result stream
        # Prints the stream's verdict in the log, and fails the job when the
        # stream is missing or invalid (status 2), since a run without valid
        # evidence isn't a pass. A valid stream of a run that didn't pass
        # (status 1) only repeats the test step's failure.
        if: always()
        run: python3 scripts/editor-results.py validate "$RUNNER_TEMP/vscode/vscode.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-vsix-macos
          path: ${{ runner.temp }}/vscode
          if-no-files-found: warn
          retention-days: 30

  lazyvim-macos-jvm:
    # The JVM build for Apple Silicon with Rosetta 2 installed. native.py
    # requires an untranslated runner and rejects translated descendants.
    if: inputs.lanes == 'all' || inputs.lanes == 'jvm'
    continue-on-error: ${{ inputs.lanes == 'jvm' }}
    name: LazyVim test (JVM archive, macOS Apple Silicon without Rosetta translation, Neovim 0.12.6)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      NVIM_VERSION: 0.12.6
      NVIM_SHA256: 1dbd148222b051ba6c307c4d17a318ed083df018a4f6a5a0ce46955ffc9ab87b
      ARCHIVE: virgil-lsp-${{ inputs.version }}-jvm-arm64-darwin.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check untranslated Apple Silicon and report Rosetta availability
        run: |
          python3 test/jvm/test_native.py
          python3 test/jvm/native.py host
      - name: Install Neovim ${{ env.NVIM_VERSION }}
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/v$NVIM_VERSION/nvim-macos-arm64.tar.gz" \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "$NVIM_SHA256  $RUNNER_TEMP/nvim.tar.gz" | shasum -a 256 --check --strict
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-macos-arm64/bin" >> "$GITHUB_PATH"
      - name: Install tmux (Homebrew)
        run: brew install tmux
      - name: Show versions
        run: |
          sw_vers
          uname -sm
          nvim --version | head -n 1
          tmux -V
      - uses: actions/download-artifact@v8
        with:
          name: archive-jvm-arm64-darwin
          path: ${{ runner.temp }}/archive
      - name: LazyVim test against the archive, checking all observed descendants
        # The test's provenance, in the log and the results, records the
        # archive's SHA-256.
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/lazyvim"
          results=(--results "$RUNNER_TEMP/lazyvim/lazyvim.jsonl" --purpose "$RESULTS_PURPOSE")
          [[ -z $RESULTS_RELEASE ]] || results+=(--release "$RESULTS_RELEASE")
          # The tmux server that runs Neovim detaches from run.sh; --adopt
          # follows it and so the servers that Neovim starts.
          python3 test/jvm/native.py run --java '*/runtime/bin/java' --min-java 2 --adopt tmux \
            --report "$RUNNER_TEMP/lazyvim/processes.json" -- \
            test/e2e/lazyvim/run.sh --out "$RUNNER_TEMP/lazyvim/results" --archive "$RUNNER_TEMP/archive/$ARCHIVE" \
            "${results[@]}" 2>&1 | tee "$RUNNER_TEMP/lazyvim/run.log"
      - name: Validate the LazyVim result stream
        # Prints the stream's verdict in the log, and fails the job when the
        # stream is missing or invalid (status 2), since a run without valid
        # evidence isn't a pass. A valid stream of a run that didn't pass
        # (status 1) only repeats the test step's failure.
        if: always()
        run: python3 scripts/editor-results.py validate "$RUNNER_TEMP/lazyvim/lazyvim.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lazyvim-macos-jvm
          path: ${{ runner.temp }}/lazyvim
          if-no-files-found: warn
          retention-days: 30

  vscode-vsix-macos-jvm:
    # The darwin-arm64-jvm VSIX and its bundled JVM server and runtime, on
    # Apple Silicon without translation, as lazyvim-macos-jvm. The artifact
    # holds the test's output, observed descendants, and, if a launch failed,
    # that launch's VS Code logs.
    if: inputs.lanes == 'all' || inputs.lanes == 'jvm'
    continue-on-error: ${{ inputs.lanes == 'jvm' }}
    name: VS Code Extension Host test (bundled JVM VSIX, macOS Apple Silicon without Rosetta translation)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check untranslated Apple Silicon and report Rosetta availability
        run: |
          python3 test/jvm/test_native.py
          python3 test/jvm/native.py host
      - uses: actions/download-artifact@v8
        with:
          name: vsix-darwin-arm64-jvm
          path: ${{ runner.temp }}/vsix
      - name: Check the producer digest
        run: |
          cd "$RUNNER_TEMP/vsix"
          shasum -a 256 --check --strict darwin-arm64-jvm.sha256
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Show versions
        run: |
          sw_vers
          uname -sm
          node --version
          grep -m 1 "VSCODE_VERSION = " clients/vscode/test/e2e/run.cjs
      - name: Install client dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Extension Host test against the installed VSIX, checking all observed descendants
        working-directory: clients/vscode
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/vscode"
          results=(--results "$RUNNER_TEMP/vscode/vscode.jsonl" --purpose "$RESULTS_PURPOSE")
          [[ -z $RESULTS_RELEASE ]] || results+=(--release "$RESULTS_RELEASE")
          python3 ../../test/jvm/native.py run --java '*/server/runtime/bin/java' --min-java 2 \
            --report "$RUNNER_TEMP/vscode/processes.json" -- \
            npm run test:e2e -- --vsix "$RUNNER_TEMP"/vsix/*.vsix --logs "$RUNNER_TEMP/vscode/logs" "${results[@]}" 2>&1 |
            tee "$RUNNER_TEMP/vscode/test.log"
      - name: Validate the Extension Host result stream
        # Prints the stream's verdict in the log, and fails the job when the
        # stream is missing or invalid (status 2), since a run without valid
        # evidence isn't a pass. A valid stream of a run that didn't pass
        # (status 1) only repeats the test step's failure.
        if: always()
        run: python3 scripts/editor-results.py validate "$RUNNER_TEMP/vscode/vscode.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-vsix-macos-jvm
          path: ${{ runner.temp }}/vscode
          if-no-files-found: warn
          retention-days: 30
