name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tested:
    # main requires pull requests to be up to date before they merge, and
    # merges squash them, so a push to main usually carries exactly the tree
    # that its pull request's CI just tested. When a merged pull request's head
    # has this commit's tree and CI passed on it, the other jobs are skipped;
    # otherwise, or if this check fails, they run.
    name: Check whether a pull request tested this tree
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Find the merged pull request's passing CI run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)
          tested=false
          for head in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null) | .head.sha'); do
            [ "$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)" = "$tree" ] || continue
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" --jq .total_count)
            if [ "$runs" -gt 0 ]; then
              echo "CI passed on pull request head $head, which has this commit's tree $tree"
              tested=true
            fi
          done
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  test:
    name: Build and test (pinned Virgil, linux x86-64)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REQUIRE_NVIM: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # full history so --version reports a described revision
      - name: Install Neovim 0.11.6
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Show pinned Virgil revision
        run: git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build and test
        run: make test
      - name: Version
        run: build/virgil-lsp --version
      # Only lazyvim-linux uses this artifact, so a failed upload mustn't fail
      # this required job; lazyvim-linux then fails at its download instead.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: server-linux
          path: |
            build/virgil-lsp
            build/virgil-lsp-worker
          if-no-files-found: error
          retention-days: 3

  lazyvim-linux:
    # Runs the LazyVim test against the server that test built and tested,
    # rather than building Virgil again. It is a separate job, not a step of
    # test, so that it reports as its own required check: it installs the
    # pinned starter and plugins from GitHub. See docs/compatibility.md for CI
    # policy and test/e2e/lazyvim/README.md#ci.
    name: LazyVim test (built server, linux)
    needs: test
    # Explicit, because the skipped tested job would otherwise skip this one.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    # A run takes about a minute after setup; the test's own deadlines, 600
    # seconds to install the plugins and parsers and 240 for each run, end a
    # stuck one sooner.
    timeout-minutes: 20
    steps:
      # The test's fixture project uses the pinned Virgil checkout's libraries.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Neovim 0.11.6
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "2fc90b962327f73a78afbfb8203fd19db8db9cdf4ee5e2bef84704339add89cc  $RUNNER_TEMP/nvim.tar.gz" |
            sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends tmux
          fi
      - name: Show versions
        run: |
          sed -n 's/^PRETTY_NAME=//p' /etc/os-release
          nvim --version | head -n 1
          tmux -V
      - uses: actions/download-artifact@v8
        with:
          name: server-linux
          path: build
      - name: Restore executable permissions
        # Artifacts don't preserve file permissions.
        run: |
          chmod +x build/virgil-lsp build/virgil-lsp-worker
          build/virgil-lsp --version
      - name: LazyVim test
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/lazyvim"
          test/e2e/lazyvim/run.sh --out "$RUNNER_TEMP/lazyvim/results" build/virgil-lsp 2>&1 |
            tee "$RUNNER_TEMP/lazyvim/run.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lazyvim-linux
          path: ${{ runner.temp }}/lazyvim
          if-no-files-found: warn
          retention-days: 14

  test-macos:
    # Apple Silicon runs the x86-64-darwin build under Rosetta 2 until Virgil
    # supports arm64-darwin (ADR-0003). See docs/compatibility.md for CI policy.
    name: Build and test (pinned Virgil, macOS Apple Silicon via Rosetta 2)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      REQUIRE_NVIM: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Neovim (Homebrew)
        run: brew install neovim
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Show host and pinned Virgil revision
        run: |
          uname -sm
          vendor/virgil/bin/dev/sense_host
          git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build and test
        run: make test
      - name: Version
        run: |
          build/virgil-lsp --version
          file build/virgil-lsp
      - uses: actions/upload-artifact@v7
        with:
          name: server-macos
          path: |
            build/virgil-lsp
            build/virgil-lsp-worker
          if-no-files-found: error
          retention-days: 3

  vscode-client:
    name: VS Code client (type-check and test, linux)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Lifecycle tests
        run: npm test
      - name: Package the VSIX
        run: npm run package
      - name: List the VSIX
        run: unzip -l virgil-lsp-vscode-*.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: clients/vscode/virgil-lsp-vscode-*.vsix
          if-no-files-found: error

  vscode-extension-host:
    # The runner image includes xvfb-run. The test downloads its pinned VS Code
    # version; see clients/vscode/README.md#extension-host-test. If a launch
    # fails, the job uploads that launch's VS Code logs, one artifact for each
    # attempt of the run.
    name: VS Code Extension Host test (built server, linux)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Build the server
        run: make
      - name: Install client dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Extension Host test
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:e2e -- --logs "$RUNNER_TEMP/vscode-logs/source"
      - name: Package the Linux archive and platform VSIX
        run: |
          scripts/package-release.sh build/release
          scripts/package-vsix.py linux-x64 --archive build/release/*.tar.gz --out "$RUNNER_TEMP/vsix"
      - name: Extension Host test against the installed platform VSIX
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:e2e -- --vsix "$RUNNER_TEMP"/vsix/*.vsix --logs "$RUNNER_TEMP/vscode-logs/vsix"
      - uses: actions/upload-artifact@v7
        # Also after a pass: a launch retried after an unresponsive window
        # keeps the failed attempt's logs. Missing logs matter only on failure.
        if: ${{ !cancelled() }}
        with:
          name: vscode-extension-host-logs-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vscode-logs
          if-no-files-found: ${{ job.status == 'failure' && 'warn' || 'ignore' }}
          retention-days: 30

  vscode-extension-host-macos:
    # Runs the test against the server that test-macos built and tested, rather
    # than building Virgil again. It is a separate job, not a step of
    # test-macos, so that it is not yet a required check; see
    # docs/compatibility.md for CI policy. macOS needs no virtual display. It
    # uploads a failed launch's VS Code logs as the Linux job does.
    name: VS Code Extension Host test (built server, macOS Apple Silicon via Rosetta 2)
    needs: test-macos
    if: ${{ !cancelled() && needs.test-macos.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # The test's fixture project uses the pinned Virgil checkout's libraries.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/download-artifact@v8
        with:
          name: server-macos
          path: build
      - name: Restore executable permissions
        # Artifacts don't preserve file permissions.
        run: |
          chmod +x build/virgil-lsp build/virgil-lsp-worker
          build/virgil-lsp --version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Install client dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Process runner tests (macOS libproc and both Darwin layouts)
        working-directory: clients/vscode
        run: node --test test/processes.cjs
      - name: Extension Host test
        working-directory: clients/vscode
        run: npm run test:e2e -- --logs "$RUNNER_TEMP/vscode-logs/source"
      - uses: actions/upload-artifact@v7
        # Also after a pass: a launch retried after an unresponsive window
        # keeps the failed attempt's logs. Missing logs matter only on failure.
        if: ${{ !cancelled() }}
        with:
          name: vscode-extension-host-macos-logs-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vscode-logs
          if-no-files-found: ${{ job.status == 'failure' && 'warn' || 'ignore' }}
          retention-days: 30
