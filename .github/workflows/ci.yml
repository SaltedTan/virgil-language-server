name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (pinned Virgil, linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REQUIRE_NVIM: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # full history so --version reports a described revision
      - name: Install Neovim 0.11.6
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Show pinned Virgil revision
        run: git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build and test
        run: make test
      - name: Version
        run: build/virgil-lsp --version
      - uses: actions/upload-artifact@v7
        with:
          name: server-linux
          path: |
            build/virgil-lsp
            build/virgil-lsp-worker
          if-no-files-found: error
          retention-days: 3

  lazyvim-linux:
    # Runs the LazyVim test against the server that test built and tested,
    # rather than building Virgil again. It is a separate job, not a step of
    # test, so that it is not a required check: it installs the pinned starter
    # and plugins from GitHub, and stays advisory until it has passed 20 runs
    # in a row. A failure still shows in the pull request. See
    # docs/compatibility.md for CI policy and test/e2e/lazyvim/README.md#ci.
    name: LazyVim test (built server, linux)
    needs: test
    runs-on: ubuntu-24.04
    # A run takes about a minute after setup; the test's own deadlines, 600
    # seconds to install the plugins and 240 for each run, end a stuck one sooner.
    timeout-minutes: 20
    steps:
      # The test's fixture project uses the pinned Virgil checkout's libraries.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Neovim 0.11.6
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "2fc90b962327f73a78afbfb8203fd19db8db9cdf4ee5e2bef84704339add89cc  $RUNNER_TEMP/nvim.tar.gz" |
            sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends tmux
          fi
      - name: Show versions
        run: |
          sed -n 's/^PRETTY_NAME=//p' /etc/os-release
          nvim --version | head -n 1
          tmux -V
      - uses: actions/download-artifact@v8
        with:
          name: server-linux
          path: build
      - name: Restore executable permissions
        # Artifacts don't preserve file permissions.
        run: |
          chmod +x build/virgil-lsp build/virgil-lsp-worker
          build/virgil-lsp --version
      - name: LazyVim test
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/lazyvim"
          test/e2e/lazyvim/run.sh --out "$RUNNER_TEMP/lazyvim/results" build/virgil-lsp 2>&1 |
            tee "$RUNNER_TEMP/lazyvim/run.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lazyvim-linux
          path: ${{ runner.temp }}/lazyvim
          if-no-files-found: warn
          retention-days: 14

  test-macos:
    # Apple Silicon runs the x86-64-darwin build under Rosetta 2 until Virgil
    # supports arm64-darwin (ADR-0003). See docs/compatibility.md for CI policy.
    name: Build and test (pinned Virgil, macOS Apple Silicon via Rosetta 2)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      REQUIRE_NVIM: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Neovim (Homebrew)
        run: brew install neovim
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Show host and pinned Virgil revision
        run: |
          uname -sm
          vendor/virgil/bin/dev/sense_host
          git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build and test
        run: make test
      - name: Version
        run: |
          build/virgil-lsp --version
          file build/virgil-lsp
      - uses: actions/upload-artifact@v7
        with:
          name: server-macos
          path: |
            build/virgil-lsp
            build/virgil-lsp-worker
          if-no-files-found: error
          retention-days: 3

  vscode-client:
    name: VS Code client (type-check and test, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Lifecycle tests
        run: npm test
      - name: Package the VSIX
        run: npm run package
      - name: List the VSIX
        run: unzip -l virgil-lsp-vscode-*.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: clients/vscode/virgil-lsp-vscode-*.vsix
          if-no-files-found: error

  vscode-extension-host:
    # The runner image includes xvfb-run. The test downloads its pinned VS Code
    # version; see clients/vscode/README.md#extension-host-test.
    name: VS Code Extension Host test (built server, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Build the server
        run: make
      - name: Install client dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Extension Host test
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:e2e
      - name: Package the VSIX
        working-directory: clients/vscode
        run: npm run package
      - name: Extension Host test against the installed VSIX
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:e2e -- --vsix virgil-lsp-vscode-*.vsix

  vscode-extension-host-macos:
    # Runs the test against the server that test-macos built and tested, rather
    # than building Virgil again. It is a separate job, not a step of
    # test-macos, so that it is not yet a required check; see
    # docs/compatibility.md for CI policy. macOS needs no virtual display.
    name: VS Code Extension Host test (built server, macOS Apple Silicon via Rosetta 2)
    needs: test-macos
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # The test's fixture project uses the pinned Virgil checkout's libraries.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/download-artifact@v8
        with:
          name: server-macos
          path: build
      - name: Restore executable permissions
        # Artifacts don't preserve file permissions.
        run: |
          chmod +x build/virgil-lsp build/virgil-lsp-worker
          build/virgil-lsp --version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Install client dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Extension Host test
        working-directory: clients/vscode
        run: npm run test:e2e
