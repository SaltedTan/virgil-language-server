name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tested:
    # main requires pull requests to be up to date before they merge, and
    # merges squash them, so a push to main usually carries exactly the tree
    # that its pull request's CI just tested. When a merged pull request's head
    # has this commit's tree and CI passed on it, the other jobs are skipped;
    # otherwise, or if this check fails, they run.
    name: Check whether a pull request tested this tree
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Find the merged pull request's passing CI run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)
          tested=false
          for head in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null) | .head.sha'); do
            [ "$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)" = "$tree" ] || continue
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" --jq .total_count)
            if [ "$runs" -gt 0 ]; then
              echo "CI passed on pull request head $head, which has this commit's tree $tree"
              tested=true
            fi
          done
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  test:
    name: Build and test (pinned Virgil, linux x86-64)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REQUIRE_NVIM: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # full history so --version reports a described revision
      - name: Install Neovim 0.11.6
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Show pinned Virgil revision
        run: git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build and test
        run: make test
      - name: Version
        run: build/virgil-lsp --version
      # Only lazyvim-linux and lspcheck-linux use this artifact, so a failed
      # upload mustn't fail this required job; they fail at their downloads
      # instead.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: server-linux
          path: |
            build/virgil-lsp
            build/virgil-lsp-worker
          if-no-files-found: error
          retention-days: 3

  lazyvim-linux:
    # Runs the LazyVim test against the server that test built and tested,
    # rather than building Virgil again. It is a separate job, not a step of
    # test, so that it reports as its own required check: it installs the
    # pinned starter and plugins from GitHub. See docs/compatibility.md for CI
    # policy and test/e2e/lazyvim/README.md#ci.
    name: LazyVim test (built server, linux)
    needs: test
    # Explicit, because the skipped tested job would otherwise skip this one.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    # A run takes about a minute after setup; the test's own deadlines, 600
    # seconds to install the plugins and parsers and 240 for each run, end a
    # stuck one sooner.
    timeout-minutes: 20
    steps:
      # The test's fixture project uses the pinned Virgil checkout's libraries.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Neovim 0.11.6
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "2fc90b962327f73a78afbfb8203fd19db8db9cdf4ee5e2bef84704339add89cc  $RUNNER_TEMP/nvim.tar.gz" |
            sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends tmux
          fi
      - name: Show versions
        run: |
          sed -n 's/^PRETTY_NAME=//p' /etc/os-release
          nvim --version | head -n 1
          tmux -V
      - uses: actions/download-artifact@v8
        with:
          name: server-linux
          path: build
      - name: Restore executable permissions
        # Artifacts don't preserve file permissions.
        run: |
          chmod +x build/virgil-lsp build/virgil-lsp-worker
          build/virgil-lsp --version
      - name: LazyVim test
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/lazyvim"
          test/e2e/lazyvim/run.sh --out "$RUNNER_TEMP/lazyvim/results" build/virgil-lsp 2>&1 |
            tee "$RUNNER_TEMP/lazyvim/run.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lazyvim-linux
          path: ${{ runner.temp }}/lazyvim
          if-no-files-found: warn
          retention-days: 14

  lspcheck-linux:
    # Checks the server that test built and tested with lspcheck, an LSP 3.17
    # and JSON-RPC 2.0 conformance checker: framing, replies, lifecycle,
    # cancellation, positions, advertised requests, message types against
    # the LSP meta-model and robustness to odd input. --strict fails the job
    # on any failed check, SHOULD and POLICY ones included, as well as on an
    # ERROR verdict. The release and its archive's SHA-256 digest change
    # together, and only on an upgrade; see
    # docs/development.md#protocol-conformance.
    name: Protocol conformance (lspcheck, built server, linux)
    needs: test
    # Explicit, because the skipped tested job would otherwise skip this one.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    # A run takes a few seconds; lspcheck bounds each of its own waits.
    timeout-minutes: 10
    env:
      LSPCHECK_VERSION: 0.4.0
      LSPCHECK_SHA256: 1b2cf96af058d734cc7a5751f1fc9a18f363e4431728e5a3b3aefc00a949be46
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server-linux
          path: build
      - name: Restore executable permissions
        # Artifacts don't preserve file permissions.
        run: |
          chmod +x build/virgil-lsp build/virgil-lsp-worker
          build/virgil-lsp --version
      - name: Install lspcheck
        run: |
          name="lspcheck-$LSPCHECK_VERSION-x86_64-unknown-linux-musl"
          curl --fail --location --retry 3 \
            "https://github.com/SaltedTan/lspcheck/releases/download/v$LSPCHECK_VERSION/$name.tar.gz" \
            -o "$RUNNER_TEMP/lspcheck.tar.gz"
          echo "$LSPCHECK_SHA256  $RUNNER_TEMP/lspcheck.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/lspcheck.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Check the server with lspcheck
        run: |
          lspcheck --version
          mkdir "$RUNNER_TEMP/lspcheck"
          lspcheck --strict --json "$RUNNER_TEMP/lspcheck/report.json" \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --transcripts "$RUNNER_TEMP/lspcheck/transcripts" -- build/virgil-lsp --stdio
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lspcheck-linux
          path: ${{ runner.temp }}/lspcheck
          if-no-files-found: warn
          retention-days: 14

  test-macos:
    # Apple Silicon runs the x86-64-darwin build under Rosetta 2 until Virgil
    # supports arm64-darwin (ADR-0003). See docs/compatibility.md for CI policy.
    name: Build and test (pinned Virgil, macOS Apple Silicon via Rosetta 2)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      REQUIRE_NVIM: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Neovim (Homebrew)
        run: brew install neovim
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Show host and pinned Virgil revision
        run: |
          uname -sm
          vendor/virgil/bin/dev/sense_host
          git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build and test
        run: make test
      - name: Version
        run: |
          build/virgil-lsp --version
          file build/virgil-lsp
      - uses: actions/upload-artifact@v7
        with:
          name: server-macos
          path: |
            build/virgil-lsp
            build/virgil-lsp-worker
          if-no-files-found: error
          retention-days: 3

  test-macos-jvm:
    # The JVM build on Apple Silicon without Rosetta 2, apart from test-macos,
    # which runs the x86-64-darwin build under Rosetta 2. Rosetta 2 is never
    # installed here, and test/jvm/native.py host checks that it is absent,
    # so the build runs the pinned bin/stable/jar Aeneas on the pinned Temurin
    # JDK. native.py run checks that every Java process the tests start runs
    # that JDK's arm64 java, untranslated. Not a required check, by the
    # maintainer's decision; see docs/compatibility.md for CI policy.
    name: Build and test (pinned Virgil, JVM, macOS Apple Silicon without Rosetta 2)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: macos-15
    # The build takes seconds and the suites about ten minutes.
    timeout-minutes: 30
    env:
      REQUIRE_NVIM: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Check that this is Apple Silicon without Rosetta 2
        run: python3 test/jvm/native.py host
      - name: Install Neovim (Homebrew)
        run: brew install neovim
      - name: Fetch the pinned JDK
        # prepare also links the bundled runtime, which must be the pinned one.
        run: |
          java=$(python3 scripts/jvm-runtime.py prepare arm64-darwin "$RUNNER_TEMP/jdk")
          "$java" -version
          echo "JAVA=$java" >> "$GITHUB_ENV"
      - name: Show host, compiler, and pinned Virgil revision
        run: |
          uname -sm
          vendor/virgil/bin/dev/sense_host
          V3C_TARGET=jvm scripts/v3c.sh -print-compiler
          git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build
        run: make V3C_TARGET=jvm JAVA="$JAVA" all build/jvm-target/stall/virgil-lsp-worker build/jvm-target/type-depth-probe
      - name: Test, checking every Java process
        # The suites of make test that the JVM build supports; see
        # docs/development.md#the-jvm-target.
        run: |
          mkdir -p "$RUNNER_TEMP/processes"
          python3 test/jvm/native.py run --java "$RUNNER_TEMP/jdk/*" --min-java 100 \
            --report "$RUNNER_TEMP/processes/make-test.json" -- make V3C_TARGET=jvm JAVA="$JAVA" test
      - name: JVM runtime tests, smoke test, and deep-start regression, checking every Java process
        run: |
          python3 test/jvm/native.py run --java "$RUNNER_TEMP/jdk/*" --min-java 2 \
            --report "$RUNNER_TEMP/processes/test-jvm.json" -- make V3C_TARGET=jvm JAVA="$JAVA" test-jvm
      - name: Version
        run: build/jvm-target/virgil-lsp --version
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: jvm-macos-processes
          path: ${{ runner.temp }}/processes
          if-no-files-found: warn
          retention-days: 14

  jvm-package:
    # Packages the JVM archive, its darwin-arm64-jvm VSIX, and the runtime's
    # source archive on Linux, as the release does, and checks them; see
    # package-jvm.yml. Not a required check (docs/compatibility.md).
    name: JVM package
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    uses: ./.github/workflows/package-jvm.yml
    with:
      vsix: true

  jvm-archive-macos:
    # The archive and VSIX that jvm-package packaged, on Apple Silicon without
    # Rosetta 2, which test/jvm/native.py host checks: the archive's smoke
    # tests, then the VS Code client's tests and the Extension Host test on
    # the installed VSIX and its bundled server. native.py run checks that
    # every Java process runs the bundled runtime's arm64 java, untranslated.
    # Not a required check (docs/compatibility.md). It uploads the processes
    # it saw and VS Code's logs as the other Extension Host jobs do.
    name: JVM archive and VSIX (macOS Apple Silicon without Rosetta 2)
    needs: jvm-package
    if: ${{ !cancelled() && needs.jvm-package.result == 'success' }}
    runs-on: macos-15
    # A run takes about ten minutes; the Extension Host test bounds its waits.
    timeout-minutes: 20
    steps:
      # The release scripts check the archive against the pinned Virgil, and
      # the Extension Host test's fixture project uses its libraries.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check that this is Apple Silicon without Rosetta 2
        run: python3 test/jvm/native.py host
      - uses: actions/download-artifact@v8
        with:
          name: archive-jvm-arm64-darwin
          path: ${{ runner.temp }}/archive
      - uses: actions/download-artifact@v8
        with:
          name: vsix-darwin-arm64-jvm
          path: ${{ runner.temp }}/vsix
      - name: Check the VSIX's producer digest
        run: |
          cd "$RUNNER_TEMP/vsix"
          shasum -a 256 --check --strict darwin-arm64-jvm.sha256
      - name: Smoke-test the archive, checking every Java process
        # Moved, with spaces in its path, through a symlink, with a read-only
        # library and an empty environment; see scripts/smoke-test-release.sh.
        run: |
          mkdir "$RUNNER_TEMP/processes"
          python3 test/jvm/native.py run --java '*/runtime/bin/java' --min-java 2 \
            --report "$RUNNER_TEMP/processes/smoke-test-release.json" -- \
            scripts/smoke-test-release.sh "$RUNNER_TEMP"/archive/virgil-lsp-*-jvm-arm64-darwin.tar.gz
      - name: JVM smoke test on the extracted archive, with no Java on PATH
        run: |
          mkdir "$RUNNER_TEMP/jvm archive"
          tar -xzf "$RUNNER_TEMP"/archive/virgil-lsp-*-jvm-arm64-darwin.tar.gz -C "$RUNNER_TEMP/jvm archive"
          server=$(echo "$RUNNER_TEMP/jvm archive"/virgil-lsp-*-jvm-arm64-darwin)
          python3 test/jvm/native.py run --java "$server/runtime/bin/java" --min-java 2 \
            --report "$RUNNER_TEMP/processes/jvm-smoke.json" -- \
            env -i PATH=/usr/bin:/bin HOME="$HOME" /usr/bin/python3 test/jvm/smoke.py "$server/virgil-lsp"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Install client dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Lifecycle tests
        working-directory: clients/vscode
        run: npm test
      - name: Extension Host test against the installed JVM VSIX, checking every Java process
        working-directory: clients/vscode
        run: |
          python3 ../../test/jvm/native.py run --java '*/server/runtime/bin/java' --min-java 2 \
            --report "$RUNNER_TEMP/processes/extension-host.json" -- \
            npm run test:e2e -- --vsix "$RUNNER_TEMP"/vsix/*.vsix --logs "$RUNNER_TEMP/vscode-logs"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: jvm-archive-macos-processes
          path: ${{ runner.temp }}/processes
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        # Also after a pass: a launch retried after an unresponsive window
        # keeps the failed attempt's logs. Missing logs matter only on failure.
        if: ${{ !cancelled() }}
        with:
          name: jvm-archive-macos-vscode-logs-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vscode-logs
          if-no-files-found: ${{ job.status == 'failure' && 'warn' || 'ignore' }}
          retention-days: 30

  vscode-client:
    name: VS Code client (type-check and test, linux)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Lifecycle tests
        run: npm test
      - name: Package the VSIX
        run: npm run package
      - name: List the VSIX
        run: unzip -l virgil-lsp-vscode-*.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: clients/vscode/virgil-lsp-vscode-*.vsix
          if-no-files-found: error

  vscode-extension-host:
    # The runner image includes xvfb-run. The test downloads its pinned VS Code
    # version; see clients/vscode/README.md#extension-host-test. If a launch
    # fails, the job uploads that launch's VS Code logs, one artifact for each
    # attempt of the run.
    name: VS Code Extension Host test (built server, linux)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Build the server
        run: make
      - name: Install client dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Extension Host test
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:e2e -- --logs "$RUNNER_TEMP/vscode-logs/source"
      - name: Package the Linux archive and platform VSIX
        run: |
          scripts/package-release.sh build/release
          scripts/package-vsix.py linux-x64 --archive build/release/*.tar.gz --out "$RUNNER_TEMP/vsix"
      - name: Extension Host test against the installed platform VSIX
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:e2e -- --vsix "$RUNNER_TEMP"/vsix/*.vsix --logs "$RUNNER_TEMP/vscode-logs/vsix"
      - uses: actions/upload-artifact@v7
        # Also after a pass: a launch retried after an unresponsive window
        # keeps the failed attempt's logs. Missing logs matter only on failure.
        if: ${{ !cancelled() }}
        with:
          name: vscode-extension-host-logs-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vscode-logs
          if-no-files-found: ${{ job.status == 'failure' && 'warn' || 'ignore' }}
          retention-days: 30

  vscode-extension-host-macos:
    # Runs the test against the server that test-macos built and tested, rather
    # than building Virgil again. It is a separate job, not a step of
    # test-macos, so that it is not yet a required check; see
    # docs/compatibility.md for CI policy. macOS needs no virtual display. It
    # uploads a failed launch's VS Code logs as the Linux job does.
    name: VS Code Extension Host test (built server, macOS Apple Silicon via Rosetta 2)
    needs: test-macos
    if: ${{ !cancelled() && needs.test-macos.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # The test's fixture project uses the pinned Virgil checkout's libraries.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/download-artifact@v8
        with:
          name: server-macos
          path: build
      - name: Restore executable permissions
        # Artifacts don't preserve file permissions.
        run: |
          chmod +x build/virgil-lsp build/virgil-lsp-worker
          build/virgil-lsp --version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Install client dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Process runner tests (macOS libproc and both Darwin layouts)
        working-directory: clients/vscode
        run: node --test test/processes.cjs
      - name: Extension Host test
        working-directory: clients/vscode
        run: npm run test:e2e -- --logs "$RUNNER_TEMP/vscode-logs/source"
      - uses: actions/upload-artifact@v7
        # Also after a pass: a launch retried after an unresponsive window
        # keeps the failed attempt's logs. Missing logs matter only on failure.
        if: ${{ !cancelled() }}
        with:
          name: vscode-extension-host-macos-logs-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vscode-logs
          if-no-files-found: ${{ job.status == 'failure' && 'warn' || 'ignore' }}
          retention-days: 30
