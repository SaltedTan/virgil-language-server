name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tested:
    # main requires pull requests to be up to date before they merge, and
    # merges squash them, so a push to main usually carries exactly the tree
    # that its pull request's CI just tested. When a merged pull request's head
    # has this commit's tree and CI passed on it, the other jobs are skipped;
    # otherwise, or if this check fails, they run.
    name: Check whether a pull request tested this tree
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Find the merged pull request's passing CI run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)
          tested=false
          for head in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null) | .head.sha'); do
            [ "$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)" = "$tree" ] || continue
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" --jq .total_count)
            if [ "$runs" -gt 0 ]; then
              echo "CI passed on pull request head $head, which has this commit's tree $tree"
              tested=true
            fi
          done
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  # Linux make test runs as test-linux-unit and two shards of test-linux-suites
  # at once, each building what it needs, and the required check test confirms
  # them. The build is deterministic, so every job builds the same executables,
  # and test checks that the shards and the unit tests ran the same ones.
  test-linux-unit:
    name: Unit tests (pinned Virgil, linux x86-64)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      worker-sha256: ${{ steps.digests.outputs.worker }}
      stall-worker-sha256: ${{ steps.digests.outputs.stall-worker }}
    steps:
      # Full history and tags, so --version reports a described revision, but
      # blobless: only the checked-out commit's files are downloaded. The build
      # reads only the pinned Virgil commit (git rev-parse HEAD), so its
      # submodule is cloned at depth 1. Every Linux job that builds the server
      # checks out the same way, so that they build the same executables.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      - name: Show pinned Virgil revision
        run: git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build and run the unit tests
        run: make test-unit
      # The workers the unit tests ran, for test to compare with the shards'.
      - name: Record the workers' digests
        id: digests
        run: |
          sha256sum build/virgil-lsp-worker build/stall/virgil-lsp-worker
          echo "worker=$(sha256sum < build/virgil-lsp-worker | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "stall-worker=$(sha256sum < build/stall/virgil-lsp-worker | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  test-linux-suites:
    # The suites of make test after the unit tests, in two shards that
    # test/suites.py balances by test/suite-times.txt. StreamTest alone takes
    # most of a shard, so more shards would not finish sooner. Each shard
    # writes a report of the suites it ran and its executables' digests, which
    # test checks.
    name: Suites ${{ matrix.shard }} (pinned Virgil, linux x86-64)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/2
            index: 1
          - shard: 2/2
            index: 2
    env:
      REQUIRE_NVIM: '1'
    steps:
      # As in test-linux-unit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      - name: Install Neovim 0.11.6
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "2fc90b962327f73a78afbfb8203fd19db8db9cdf4ee5e2bef84704339add89cc  $RUNNER_TEMP/nvim.tar.gz" |
            sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Show pinned Virgil revision
        run: git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build and run the shard's suites
        run: >-
          make test-suites SHARD=${{ matrix.shard }}
          SUITE_REPORT="$RUNNER_TEMP/shard-${{ matrix.index }}.json"
          SUITE_DIGESTS="build/virgil-lsp build/virgil-lsp-worker build/stall/virgil-lsp-worker"
      - name: Version
        run: build/virgil-lsp --version
      - uses: actions/upload-artifact@v7
        with:
          name: linux-suites-shard-${{ matrix.index }}
          path: ${{ runner.temp }}/shard-${{ matrix.index }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  test:
    # The required check for Linux make test. It runs whatever its needs'
    # results, since a skipped required check counts as passing, and passes
    # only when the unit tests and both shards passed, the shards together ran
    # every suite of make test exactly once, and every shard and the unit
    # tests ran the same executables.
    name: Build and test (pinned Virgil, linux x86-64)
    needs: [tested, test-linux-unit, test-linux-suites]
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that the unit tests and every shard passed
        env:
          UNIT: ${{ needs.test-linux-unit.result }}
          SUITES: ${{ needs.test-linux-suites.result }}
        run: |
          echo "test-linux-unit: $UNIT"
          echo "test-linux-suites: $SUITES"
          [ "$UNIT" = success ] && [ "$SUITES" = success ]
      # Only the Makefile and test/suites.py, which need no submodule.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-suites-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards
      - name: Check that the shards ran every suite once, on the unit tests' workers
        env:
          WORKER_SHA256: ${{ needs.test-linux-unit.outputs.worker-sha256 }}
          STALL_WORKER_SHA256: ${{ needs.test-linux-unit.outputs.stall-worker-sha256 }}
        run: |
          make -s --no-print-directory V3C_TARGET=x86-64-linux print-suites > "$RUNNER_TEMP/suites.txt"
          python3 test/suites.py --verify=2 --expected="$RUNNER_TEMP/suites.txt" \
            --digest="build/virgil-lsp-worker=$WORKER_SHA256" \
            --digest="build/stall/virgil-lsp-worker=$STALL_WORKER_SHA256" \
            "$RUNNER_TEMP/shards/shard-1.json" "$RUNNER_TEMP/shards/shard-2.json"

  lazyvim-linux:
    # Builds the server and runs the LazyVim test against it, at the same time
    # as the other Linux jobs. It is a job of its own so that it reports as its
    # own required check. It restores the pinned starter, plugins, and parsers
    # from the cache that seed-caches.yml saves on main, and installs them from
    # GitHub when there is none for this pull request's inputs. See
    # docs/compatibility.md for CI policy and test/e2e/lazyvim/README.md#ci.
    name: LazyVim test (built server, linux)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    # A run takes about a minute after setup; the test's own deadlines, 600
    # seconds to install the plugins and parsers and 240 for each run, end a
    # stuck one sooner.
    timeout-minutes: 20
    steps:
      # As in test-linux-unit. The test's fixture project also uses the pinned
      # Virgil checkout's libraries.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      - name: Install Neovim 0.11.6
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "2fc90b962327f73a78afbfb8203fd19db8db9cdf4ee5e2bef84704339add89cc  $RUNNER_TEMP/nvim.tar.gz" |
            sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends tmux
          fi
      - name: Show versions
        run: |
          sed -n 's/^PRETTY_NAME=//p' /etc/os-release
          nvim --version | head -n 1
          tmux -V
      # Pull requests only restore caches; seed-caches.yml saves them on main,
      # with the same keys and paths.
      - name: Compute the cache key
        id: keys
        run: scripts/ci-cache-keys.sh lazyvim >> "$GITHUB_OUTPUT"
      - name: Restore the LazyVim starter, plugins, and parsers
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/lazyvim-cache
          key: ${{ steps.keys.outputs.lazyvim }}
      - name: Build the server
        run: |
          make
          build/virgil-lsp --version
      # Without a restored cache, run.sh installs from GitHub as it would
      # without --cache, and leaves the directory alone.
      - name: LazyVim test
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/lazyvim"
          test/e2e/lazyvim/run.sh --cache "$RUNNER_TEMP/lazyvim-cache" --out "$RUNNER_TEMP/lazyvim/results" \
            build/virgil-lsp 2>&1 | tee "$RUNNER_TEMP/lazyvim/run.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lazyvim-linux
          path: ${{ runner.temp }}/lazyvim
          if-no-files-found: warn
          retention-days: 14

  lspcheck-linux:
    # Builds the server and checks it with lspcheck, an LSP 3.17 and JSON-RPC
    # 2.0 conformance checker: framing, replies, lifecycle, cancellation,
    # positions, advertised requests, message types against the LSP
    # meta-model and robustness to odd input, then, in a step of its own,
    # survival of and recovery from seeded edits to real Virgil source. Both
    # use the profile test/protocol/lspcheck.toml. --strict fails a step on any
    # failed check, SHOULD and POLICY ones included, as well as on an ERROR
    # verdict. The release and its archive's SHA-256 digest change together,
    # and only on an upgrade; see docs/development.md#protocol-conformance.
    name: Protocol conformance (lspcheck, built server, linux)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    # Both runs take a few seconds. lspcheck bounds each of its own waits, and
    # the profile's run_timeout bounds the mutation run at about 10 minutes
    # when the server hangs.
    timeout-minutes: 20
    env:
      LSPCHECK_VERSION: 0.6.0
      LSPCHECK_SHA256: 563a6392f48fff2ad5e6e6d05529fb1d25d128f872cb1a99ea9d2f7b5602a046
      # The mutation plan: the same seed and case count give the same edits.
      LSPCHECK_MUTATION_SEED: 20261115
      LSPCHECK_MUTATION_CASES: 100
    steps:
      # As in test-linux-unit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      - name: Build the server
        run: |
          make
          build/virgil-lsp --version
      - name: Install lspcheck
        id: install
        run: |
          name="lspcheck-$LSPCHECK_VERSION-x86_64-unknown-linux-musl"
          curl --fail --location --retry 3 \
            "https://github.com/SaltedTan/lspcheck/releases/download/v$LSPCHECK_VERSION/$name.tar.gz" \
            -o "$RUNNER_TEMP/lspcheck.tar.gz"
          echo "$LSPCHECK_SHA256  $RUNNER_TEMP/lspcheck.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/lspcheck.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Check the server with lspcheck
        run: |
          lspcheck --version
          mkdir "$RUNNER_TEMP/lspcheck"
          lspcheck --strict --profile test/protocol/lspcheck.toml \
            --json "$RUNNER_TEMP/lspcheck/report.json" \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --transcripts "$RUNNER_TEMP/lspcheck/transcripts" -- build/virgil-lsp --stdio
      - name: Mutate the profile's source with lspcheck (experimental)
        # Apart from the step above, so that its verdicts, report and
        # transcripts stay separate and the step can be dropped alone while
        # --mutate is experimental. It runs when the step above fails too.
        # --only keeps the checks the mutation scenario gives evidence for.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/lspcheck"
          lspcheck --strict --profile test/protocol/lspcheck.toml --mutate \
            --mutation-seed "$LSPCHECK_MUTATION_SEED" --mutation-cases "$LSPCHECK_MUTATION_CASES" \
            --only M1,M2,M3,D1,D2,D6,K1,K2,F1,F2,F8,J1,J2,J5,J7,L9 \
            --json "$RUNNER_TEMP/lspcheck/mutation-report.json" \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --transcripts "$RUNNER_TEMP/lspcheck/mutation-transcripts" -- build/virgil-lsp --stdio
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lspcheck-linux
          path: ${{ runner.temp }}/lspcheck
          if-no-files-found: warn
          retention-days: 14

  # macOS make test fans out as Linux make test does: test-macos-unit and two
  # shards of test-macos-suites run at once, and the required check
  # test-macos confirms them. Apple Silicon runs the x86-64-darwin build under
  # Rosetta 2 until Virgil supports arm64-darwin (ADR-0003). See
  # docs/compatibility.md for CI policy.
  test-macos-unit:
    name: Unit tests (pinned Virgil, macOS Apple Silicon via Rosetta 2)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      worker-sha256: ${{ steps.digests.outputs.worker }}
      stall-worker-sha256: ${{ steps.digests.outputs.stall-worker }}
    steps:
      # As in test-linux-unit. Every macOS job that builds the server checks
      # out the same way, so that they build the same executables.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Show host and pinned Virgil revision
        run: |
          uname -sm
          vendor/virgil/bin/dev/sense_host
          git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build and run the unit tests
        run: make test-unit
      # The workers the unit tests ran, for test-macos to compare with the
      # shards'.
      - name: Record the workers' digests
        id: digests
        run: |
          shasum -a 256 build/virgil-lsp-worker build/stall/virgil-lsp-worker
          echo "worker=$(shasum -a 256 < build/virgil-lsp-worker | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "stall-worker=$(shasum -a 256 < build/stall/virgil-lsp-worker | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  test-macos-suites:
    # As test-linux-suites, on macOS. The shards come from the same
    # test/suite-times.txt.
    name: Suites ${{ matrix.shard }} (pinned Virgil, macOS Apple Silicon via Rosetta 2)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/2
            index: 1
          - shard: 2/2
            index: 2
    env:
      REQUIRE_NVIM: '1'
    steps:
      # As in test-macos-unit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      # The editor tests' pinned macOS Neovim (editor-test-suites.yml).
      - name: Install Neovim 0.12.6
        env:
          NVIM_VERSION: 0.12.6
          NVIM_SHA256: 1dbd148222b051ba6c307c4d17a318ed083df018a4f6a5a0ce46955ffc9ab87b
        run: |
          curl --fail --location \
            "https://github.com/neovim/neovim/releases/download/v$NVIM_VERSION/nvim-macos-arm64.tar.gz" \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "$NVIM_SHA256  $RUNNER_TEMP/nvim.tar.gz" | shasum -a 256 --check --strict
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-macos-arm64/bin" >> "$GITHUB_PATH"
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Show host and pinned Virgil revision
        run: |
          uname -sm
          vendor/virgil/bin/dev/sense_host
          git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build and run the shard's suites
        run: >-
          make test-suites SHARD=${{ matrix.shard }}
          SUITE_REPORT="$RUNNER_TEMP/shard-${{ matrix.index }}.json"
          SUITE_DIGESTS="build/virgil-lsp build/virgil-lsp-worker build/stall/virgil-lsp-worker"
      - name: Version
        run: |
          build/virgil-lsp --version
          file build/virgil-lsp
      - uses: actions/upload-artifact@v7
        with:
          name: macos-suites-shard-${{ matrix.index }}
          path: ${{ runner.temp }}/shard-${{ matrix.index }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  test-macos:
    # The required check for macOS make test, as test is for Linux: it runs
    # whatever its needs' results and passes only when the unit tests and both
    # shards passed, the shards together ran every suite of make test exactly
    # once, and every shard and the unit tests ran the same executables. It
    # only reads reports and digests, so it runs on Linux: it takes no macOS
    # runner from the five that may run at once and never waits in the macOS
    # queue.
    name: Build and test (pinned Virgil, macOS Apple Silicon via Rosetta 2)
    needs: [tested, test-macos-unit, test-macos-suites]
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that the unit tests and every shard passed
        env:
          UNIT: ${{ needs.test-macos-unit.result }}
          SUITES: ${{ needs.test-macos-suites.result }}
        run: |
          echo "test-macos-unit: $UNIT"
          echo "test-macos-suites: $SUITES"
          [ "$UNIT" = success ] && [ "$SUITES" = success ]
      # Only the Makefile and test/suites.py, which need no submodule.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-suites-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards
      # V3C_TARGET names the shards' target rather than this runner's, and
      # spares host detection, which needs the submodule.
      - name: Check that the shards ran every suite once, on the unit tests' workers
        env:
          WORKER_SHA256: ${{ needs.test-macos-unit.outputs.worker-sha256 }}
          STALL_WORKER_SHA256: ${{ needs.test-macos-unit.outputs.stall-worker-sha256 }}
        run: |
          make -s --no-print-directory V3C_TARGET=x86-64-darwin print-suites > "$RUNNER_TEMP/suites.txt"
          python3 test/suites.py --verify=2 --expected="$RUNNER_TEMP/suites.txt" \
            --digest="build/virgil-lsp-worker=$WORKER_SHA256" \
            --digest="build/stall/virgil-lsp-worker=$STALL_WORKER_SHA256" \
            "$RUNNER_TEMP/shards/shard-1.json" "$RUNNER_TEMP/shards/shard-2.json"

  jvm-package:
    # Packages the JVM archive, its darwin-arm64-jvm VSIX, and the runtime's
    # source archive on Linux, as the release does, and checks them; see
    # package-jvm.yml. Not a required check (docs/compatibility.md). The
    # JVM lanes on Apple Silicon, which test what it packages, are in jvm.yml.
    name: JVM package
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    uses: ./.github/workflows/package-jvm.yml
    with:
      vsix: true

  vscode-client:
    name: VS Code client (type-check and test, linux)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v7
      # The Node version, keys, and paths of the caches are those that
      # seed-caches.yml saves on main. Pull requests only restore them.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Compute the cache key
        id: keys
        working-directory: .
        run: scripts/ci-cache-keys.sh node-modules >> "$GITHUB_OUTPUT"
      # Only on an exact key: a change to package.json or package-lock.json
      # misses and installs from the lockfile.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: clients/vscode/node_modules
          key: ${{ steps.keys.outputs.node-modules }}
      - name: Install dependencies from the lockfile
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Lifecycle tests
        run: npm test
      - name: Package the VSIX
        run: npm run package
      - name: List the VSIX
        run: unzip -l virgil-lsp-vscode-*.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: clients/vscode/virgil-lsp-vscode-*.vsix
          if-no-files-found: error

  vscode-extension-host:
    # Two legs at once: source tests the extension from the checkout against
    # a server built here, and vsix installs the linux-x64 platform VSIX,
    # packaged here from a release archive that package-release.sh builds,
    # and tests its bundled server. The runner image includes xvfb-run. The
    # test downloads its pinned VS Code version unless it is restored from the
    # cache that seed-caches.yml saves on main, as node_modules is; see
    # clients/vscode/README.md#extension-host-test. If a launch fails, the leg
    # uploads that launch's VS Code logs, one artifact for each attempt of the
    # run.
    name: VS Code Extension Host test (${{ matrix.label }}, linux)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: source
            label: built server
          - mode: vsix
            label: platform VSIX
    steps:
      # As in test-linux-unit. The test's fixture project uses the pinned
      # Virgil checkout's libraries.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      # As in vscode-client.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Compute the cache keys
        id: keys
        run: scripts/ci-cache-keys.sh node-modules vscode >> "$GITHUB_OUTPUT"
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: clients/vscode/node_modules
          key: ${{ steps.keys.outputs.node-modules }}
      # The test uses a restored VS Code only if its download completed.
      - name: Restore the pinned VS Code
        uses: actions/cache/restore@v6
        with:
          path: clients/vscode/.vscode-test
          key: ${{ steps.keys.outputs.vscode }}
      - name: Build the server
        if: matrix.mode == 'source'
        run: make
      - name: Install client dependencies from the lockfile
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: clients/vscode
        run: npm ci
      - name: Extension Host test
        if: matrix.mode == 'source'
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:e2e -- --logs "$RUNNER_TEMP/vscode-logs/source"
      - name: Package the Linux archive and platform VSIX
        if: matrix.mode == 'vsix'
        run: |
          scripts/package-release.sh build/release
          scripts/package-vsix.py linux-x64 --archive build/release/*.tar.gz --out "$RUNNER_TEMP/vsix"
      - name: Extension Host test against the installed platform VSIX
        if: matrix.mode == 'vsix'
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:e2e -- --vsix "$RUNNER_TEMP"/vsix/*.vsix --logs "$RUNNER_TEMP/vscode-logs/vsix"
      - uses: actions/upload-artifact@v7
        # Also after a pass: a launch retried after an unresponsive window
        # keeps the failed attempt's logs. Missing logs matter only on failure.
        if: ${{ !cancelled() }}
        with:
          name: vscode-extension-host-${{ matrix.mode }}-logs-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vscode-logs
          if-no-files-found: ${{ job.status == 'failure' && 'warn' || 'ignore' }}
          retention-days: 30

  vscode-extension-host-macos:
    # Builds the server and runs the test against it, at the same time as the
    # macOS test jobs, rather than waiting for them. It is a separate job, not
    # one of the jobs test-macos confirms, so that it is not yet a required check; see
    # docs/compatibility.md for CI policy. macOS needs no virtual display. It
    # restores node_modules and VS Code, and uploads a failed launch's VS Code
    # logs, as the Linux job does.
    name: VS Code Extension Host test (built server, macOS Apple Silicon via Rosetta 2)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # As in test-macos-unit. The test's fixture project uses the pinned
      # Virgil checkout's libraries.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build the server
        run: |
          make
          build/virgil-lsp --version
          file build/virgil-lsp
      # As in vscode-extension-host.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Compute the cache keys
        id: keys
        run: scripts/ci-cache-keys.sh node-modules vscode >> "$GITHUB_OUTPUT"
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: clients/vscode/node_modules
          key: ${{ steps.keys.outputs.node-modules }}
      - name: Restore the pinned VS Code
        uses: actions/cache/restore@v6
        with:
          path: clients/vscode/.vscode-test
          key: ${{ steps.keys.outputs.vscode }}
      - name: Install client dependencies from the lockfile
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: clients/vscode
        run: npm ci
      - name: Process runner tests (macOS libproc and both Darwin layouts)
        working-directory: clients/vscode
        run: node --test test/processes.cjs
      - name: Extension Host test
        working-directory: clients/vscode
        run: npm run test:e2e -- --logs "$RUNNER_TEMP/vscode-logs/source"
      - uses: actions/upload-artifact@v7
        # Also after a pass: a launch retried after an unresponsive window
        # keeps the failed attempt's logs. Missing logs matter only on failure.
        if: ${{ !cancelled() }}
        with:
          name: vscode-extension-host-macos-logs-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vscode-logs
          if-no-files-found: ${{ job.status == 'failure' && 'warn' || 'ignore' }}
          retention-days: 30
