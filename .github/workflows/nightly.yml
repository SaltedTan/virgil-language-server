name: Nightly from-scratch

# Runs make test and the LazyVim, lspcheck, VS Code client, and Extension Host
# tests every night on main from a fresh clone, with no caches anywhere: no
# actions/cache, no actions/setup-node cache, and no --cache on LazyVim. This
# catches cold-install, cold-download, and uncached-build regressions that
# ci.yml's cache-restored paths hide. On macOS make test runs against the
# newest Homebrew Neovim rather than the pinned 0.12.6 tarball ci.yml uses, so
# a Neovim regression surfaces here before it reaches a PR. make test uses
# UNIT_SHUFFLE=1 so a different random group order runs each night and prints
# its seed, which the final summary line repeats for reproduction with
# UNIT_SEED=N. The report job summarizes the last 30 PR runs' running times
# with scripts/check-ci-budgets.py summarize into the step summary, and on
# main a failure opens or comments on an issue.
#
# No required check, by maintainer decision; see docs/compatibility.md.
# Schedule is offset from seed-caches.yml (15:19 UTC) and jvm.yml (16:43 UTC)
# so the macOS runner slots do not collide.

on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-linux:
    name: Build and test from scratch (pinned Virgil, linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REQUIRE_NVIM: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      - name: Install Neovim 0.11.6
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "2fc90b962327f73a78afbfb8203fd19db8db9cdf4ee5e2bef84704339add89cc  $RUNNER_TEMP/nvim.tar.gz" |
            sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Show host, compiler, and pinned Virgil revision
        run: |
          uname -sm
          vendor/virgil/bin/dev/sense_host
          scripts/v3c.sh -print-compiler
          git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build and test with a randomized unit-test group order
        run: make test UNIT_SHUFFLE=1
      - name: Version
        run: build/virgil-lsp --version

  lazyvim-linux:
    name: LazyVim test from scratch (built server, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      - name: Install Neovim 0.11.6
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "2fc90b962327f73a78afbfb8203fd19db8db9cdf4ee5e2bef84704339add89cc  $RUNNER_TEMP/nvim.tar.gz" |
            sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends tmux
          fi
      - name: Show versions
        run: |
          sed -n 's/^PRETTY_NAME=//p' /etc/os-release
          nvim --version | head -n 1
          tmux -V
      - name: Build the server
        run: |
          make
          build/virgil-lsp --version
      # Cold: no --cache, so run.sh installs the LazyVim starter, plugins, and
      # parsers from GitHub.
      - name: LazyVim test
        run: |
          mkdir "$RUNNER_TEMP/lazyvim-archive"
          test/e2e/lazyvim/run.sh --out "$RUNNER_TEMP/lazyvim-archive" build/virgil-lsp
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lazyvim-linux-archive
          path: ${{ runner.temp }}/lazyvim-archive
          if-no-files-found: warn
          retention-days: 14

  lspcheck-linux:
    name: Protocol conformance from scratch (lspcheck, built server, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LSPCHECK_VERSION: 0.6.0
      LSPCHECK_SHA256: 563a6392f48fff2ad5e6e6d05529fb1d25d128f872cb1a99ea9d2f7b5602a046
      LSPCHECK_MUTATION_SEED: 20261115
      LSPCHECK_MUTATION_CASES: 100
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      - name: Install lspcheck
        id: install
        run: |
          name="lspcheck-$LSPCHECK_VERSION-x86_64-unknown-linux-musl"
          curl --fail --location --retry 3 \
            "https://github.com/SaltedTan/lspcheck/releases/download/v$LSPCHECK_VERSION/$name.tar.gz" \
            -o "$RUNNER_TEMP/lspcheck.tar.gz"
          echo "$LSPCHECK_SHA256  $RUNNER_TEMP/lspcheck.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/lspcheck.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Build the server
        id: build
        run: |
          make
          build/virgil-lsp --version
      - name: Check the server with lspcheck
        run: |
          lspcheck --version
          mkdir "$RUNNER_TEMP/lspcheck"
          lspcheck --strict --profile test/protocol/lspcheck.toml \
            --json "$RUNNER_TEMP/lspcheck/report.json" \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --transcripts "$RUNNER_TEMP/lspcheck/transcripts" -- build/virgil-lsp --stdio
      - name: Mutate the profile's source with lspcheck (experimental)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/lspcheck"
          lspcheck --strict --profile test/protocol/lspcheck.toml --mutate \
            --mutation-seed "$LSPCHECK_MUTATION_SEED" --mutation-cases "$LSPCHECK_MUTATION_CASES" \
            --only M1,M2,M3,D1,D2,D6,K1,K2,F1,F2,F8,J1,J2,J5,J7,L9 \
            --json "$RUNNER_TEMP/lspcheck/mutation-report.json" \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --transcripts "$RUNNER_TEMP/lspcheck/mutation-transcripts" -- build/virgil-lsp --stdio
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lspcheck-linux-nightly
          path: ${{ runner.temp }}/lspcheck
          if-no-files-found: warn
          retention-days: 14

  vscode-client:
    name: VS Code client from scratch (type-check and test, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Lifecycle tests
        run: npm test
      - name: Package the VSIX
        run: npm run package
      - name: List the VSIX
        run: unzip -l virgil-lsp-vscode-*.vsix

  vscode-extension-host-linux:
    name: VS Code Extension Host from scratch (${{ matrix.label }}, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: source
            label: built server
          - mode: vsix
            label: platform VSIX
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install client dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Build the server
        if: matrix.mode == 'source'
        run: make
      - name: Extension Host test
        if: matrix.mode == 'source'
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:e2e -- --logs "$RUNNER_TEMP/vscode-logs/source"
      - name: Package the Linux archive and platform VSIX
        if: matrix.mode == 'vsix'
        run: |
          scripts/package-release.sh build/release
          scripts/package-vsix.py linux-x64 --archive build/release/*.tar.gz --out "$RUNNER_TEMP/vsix"
      - name: Extension Host test against the installed platform VSIX
        if: matrix.mode == 'vsix'
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:e2e -- --vsix "$RUNNER_TEMP"/vsix/*.vsix --logs "$RUNNER_TEMP/vscode-logs/vsix"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: nightly-vscode-extension-host-${{ matrix.mode }}-logs-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vscode-logs
          if-no-files-found: ${{ job.status == 'failure' && 'warn' || 'ignore' }}
          retention-days: 30

  test-macos:
    name: Build and test from scratch (pinned Virgil, Homebrew Neovim, macOS Apple Silicon via Rosetta 2)
    runs-on: macos-15
    timeout-minutes: 25
    env:
      REQUIRE_NVIM: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      # Homebrew Neovim, not the pinned 0.12.6 tarball ci.yml uses: this is the
      # early warning for a Neovim regression (maintainer decision 5).
      - name: Install Neovim from Homebrew
        run: |
          brew install neovim
          nvim --version | head -n 1
      - name: Show host, compiler, and pinned Virgil revision
        run: |
          uname -sm
          vendor/virgil/bin/dev/sense_host
          scripts/v3c.sh -print-compiler
          git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Build and test with a randomized unit-test group order
        run: make test UNIT_SHUFFLE=1
      - name: Version
        run: |
          build/virgil-lsp --version
          file build/virgil-lsp

  vscode-extension-host-macos:
    name: VS Code Extension Host from scratch (built server, macOS Apple Silicon via Rosetta 2)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the pinned Virgil
        run: git submodule update --init --recursive --depth 1
      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install client dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Build the server
        run: |
          make
          build/virgil-lsp --version
          file build/virgil-lsp
      - name: Process runner tests (macOS libproc and both Darwin layouts)
        working-directory: clients/vscode
        run: node --test test/processes.cjs
      - name: Extension Host test
        working-directory: clients/vscode
        run: npm run test:e2e -- --logs "$RUNNER_TEMP/vscode-logs/source"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: nightly-vscode-extension-host-macos-logs-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vscode-logs
          if-no-files-found: ${{ job.status == 'failure' && 'warn' || 'ignore' }}
          retention-days: 30

  report:
    name: Nightly summary and failure report
    needs: [test-linux, lazyvim-linux, lspcheck-linux, vscode-client, vscode-extension-host-linux, test-macos, vscode-extension-host-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Summarize the last 30 PR runs' running-time budgets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          runs=$(gh run list --repo "$REPO" --workflow ci.yml --event pull_request \
            --status completed --limit 30 --json databaseId --jq '.[].databaseId')
          jobs_file="$RUNNER_TEMP/ci-runs.json"
          : > "$jobs_file"
          count=0
          for run in $runs; do
            gh api "repos/$REPO/actions/runs/$run/jobs?filter=all&per_page=100" >> "$jobs_file"
            count=$((count + 1))
          done
          echo "Fetched $count PR runs of ci.yml."
          summary="$RUNNER_TEMP/budget-summary.md"
          {
            echo "## CI running-time budgets (last 30 PR runs)"
            echo
            if [ "$count" -eq 0 ]; then
              echo "No completed pull_request runs of ci.yml were found."
            else
              python3 scripts/check-ci-budgets.py summarize --runs-json "$jobs_file"
            fi
          } > "$summary"
          cat "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
      # Counts #205 Extension Host relaunches across recent completed runs and
      # fails if the relaunch rate exceeds 2%. Only fetches annotations for
      # Extension Host and "JVM archive and VSIX" jobs to stay well within the
      # Check Runs API rate limit. See scripts/check-vscode-relaunch-rate.py.
      - name: Count Extension Host relaunches (#205) and gate on the rate
        id: relaunch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          jobs_file="$RUNNER_TEMP/relaunch-jobs.jsonl"
          records="$RUNNER_TEMP/relaunch-records.jsonl"
          : > "$jobs_file"
          total_runs=0
          for workflow in ci.yml nightly.yml jvm.yml; do
            case "$workflow" in
              ci.yml) limit=100 ;;
              *) limit=30 ;;
            esac
            run_ids=$(gh run list --repo "$REPO" --workflow "$workflow" --status completed \
              --created ">=$cutoff" --limit "$limit" --json databaseId --jq '.[].databaseId')
            for run_id in $run_ids; do
              total_runs=$((total_runs + 1))
              gh api "repos/$REPO/actions/runs/$run_id/jobs?filter=all&per_page=100" --paginate \
                --jq '.jobs[] | select((.name | contains("Extension Host") or contains("JVM archive and VSIX")) and .status == "completed" and .conclusion != "cancelled" and .conclusion != "skipped") | @json' \
                >> "$jobs_file"
            done
          done
          total_matched=$(wc -l < "$jobs_file")
          echo "Scanned $total_runs completed runs; matched $total_matched Extension Host jobs."
          : > "$records"
          while IFS= read -r job_line; do
            [ -n "$job_line" ] || continue
            job_id=$(printf '%s' "$job_line" | python3 -c 'import json, sys; print(json.loads(sys.stdin.read()).get("id") or "")')
            [ -n "$job_id" ] || continue
            annotations=$(gh api "repos/$REPO/check-runs/$job_id/annotations?per_page=100" --paginate 2>/dev/null || echo '[]')
            python3 - "$job_line" "$annotations" >> "$records" <<'PY'
          import json, sys
          job = json.loads(sys.argv[1])
          text, dec, idx, anns = sys.argv[2], json.JSONDecoder(), 0, []
          while idx < len(text):
              while idx < len(text) and text[idx].isspace():
                  idx += 1
              if idx >= len(text):
                  break
              page, idx = dec.raw_decode(text, idx)
              if isinstance(page, list):
                  anns.extend(page)
          print(json.dumps({"job": job, "annotations": anns}))
          PY
          done < "$jobs_file"
          summary="$RUNNER_TEMP/relaunch-summary.md"
          set +e
          {
            echo "## Extension Host relaunch rate (#205)"
            echo
            python3 scripts/check-vscode-relaunch-rate.py --input "$records" --max-rate 0.02
          } | tee "$summary"
          status=${PIPESTATUS[0]}
          set -e
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Open or update the issue on main failure
        if: >-
          ${{ !cancelled() && github.ref == 'refs/heads/main'
          && (steps.relaunch.outcome == 'failure'
              || contains(needs.*.result, 'failure')
              || contains(needs.*.result, 'cancelled')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          RELAUNCH_RESULT: ${{ steps.relaunch.outcome }}
          RESULTS: |-
            - test-linux: ${{ needs.test-linux.result }}
            - lazyvim-linux: ${{ needs.lazyvim-linux.result }}
            - lspcheck-linux: ${{ needs.lspcheck-linux.result }}
            - vscode-client: ${{ needs.vscode-client.result }}
            - vscode-extension-host-linux: ${{ needs.vscode-extension-host-linux.result }}
            - test-macos: ${{ needs.test-macos.result }}
            - vscode-extension-host-macos: ${{ needs.vscode-extension-host-macos.result }}
            - relaunch-rate (#205): ${{ steps.relaunch.outcome }}
        run: |
          title="Nightly from-scratch run failed on main"
          body="The nightly from-scratch workflow failed on $SHA (event: $EVENT): $RUN_URL

          $RESULTS"
          if [ "$RELAUNCH_RESULT" = "failure" ]; then
            body="$body

          The Extension Host relaunch rate (#205) exceeded 2%; see the run's step summary for the count and per-job breakdown."
          fi
          number=$(gh issue list --repo "$REPO" --state open --limit 1000 --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
