name: Editor tests (weekly)

# Runs the editor tests in full, where pull request CI runs only part of them:
# the LazyVim test on Linux with Neovim 0.11 and 0.12 and on macOS, the
# Extension Host test on macOS against a packaged VSIX, and the same suite
# through VS Code Remote-SSH on Linux, plus the clean README install in a Linux
# container. It builds the server archives from
# source and packages the VSIX as the release workflow does, then runs the
# jobs of editor-test-suites.yml on them, which the release workflow also runs
# on each release's own files. The LazyVim test installs the pinned starter
# and plugins from GitHub, and the Remote-SSH test VS Code, Remote-SSH, and the
# VS Code Server from Microsoft, without a cache. Failures here do not block
# merges; they signal that an editor, a plugin, or a runner image now behaves
# differently with the server. See test/e2e/lazyvim/README.md#ci,
# clients/vscode/README.md#remote-ssh-test, and docs/manual-testing.md for
# coverage.

on:
  schedule:
    - cron: "41 4 * * 1" # weekly, Monday 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

# A group of its own, so that these runs never cancel or wait for CI or the
# release workflow.
concurrency:
  group: editor-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Packages the server with the release workflow's script, without the
    # release's tests. Apple Silicon runs the x86-64-darwin build under
    # Rosetta 2 until Virgil supports arm64-darwin (ADR-0003).
    name: Build and package (pinned Virgil, ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux x86-64
            os: ubuntu-24.04
            target: x86-64-linux
          - platform: macOS Apple Silicon via Rosetta 2
            os: macos-15
            target: x86-64-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # full history so --version reports a described revision
      - name: Install Rosetta 2
        if: runner.os == 'macOS'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Show host and pinned Virgil revision
        run: |
          uname -sm
          vendor/virgil/bin/dev/sense_host
          git -C vendor/virgil log -1 --format='%H %cs %s'
      - name: Package
        run: |
          scripts/package-release.sh build/release
          cat build/release/*.manifest.json
      - name: Record the archive digest for the clean install test
        run: shasum -a 256 build/release/*.tar.gz > "$RUNNER_TEMP/archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: checksum-${{ matrix.target }}
          path: ${{ runner.temp }}/archive.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: build/release/
          if-no-files-found: error
          retention-days: 3

  vsix:
    name: Package the VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      file: ${{ steps.package.outputs.file }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Install dependencies from the lockfile
        working-directory: clients/vscode
        run: npm ci
      - name: Record the server's version, which names the archives
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Package the VSIX
        id: package
        working-directory: clients/vscode
        run: |
          npm run package
          file=virgil-lsp-vscode-$(node -p 'require("./package.json").version').vsix
          sha256=$(sha256sum "$file" | cut -d ' ' -f 1)
          echo "$sha256  $file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: clients/vscode/${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 3

  editor-tests:
    name: Editor tests
    needs: [build, vsix]
    uses: ./.github/workflows/editor-test-suites.yml
    with:
      version: ${{ needs.vsix.outputs.version }}
      vsix-file: ${{ needs.vsix.outputs.file }}
      vsix-sha256: ${{ needs.vsix.outputs.sha256 }}
