name: Bug report
description: Something in the server or an editor integration does not work.
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A minimal reproduction makes bugs much faster to fix.

        Please check the [known limitations](https://github.com/SaltedTan/virgil-language-server/blob/main/docs/known-limitations.md) first.
        Type errors, definition, and hover need a project file. Some syntax errors can be recovered; see [error tolerance](https://github.com/SaltedTan/virgil-language-server/blob/main/docs/known-limitations.md#no-error-tolerant-parsing) for the cases where semantic features remain unavailable.
  - type: checkboxes
    id: checks
    attributes:
      label: Before reporting
      options:
        - label: I checked the known limitations and the existing issues.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        Include the smallest `.v3` file(s) that show the problem, and the editor actions you took.
      placeholder: |
        1. Open `example.v3` containing ...
        2. Hover over ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: project-file
    attributes:
      label: Project file
      description: |
        Paste the `.virgil-lsp.json` that governs the file, the nearest one above it.
        Write "none" if there isn't one.
      render: json
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Server version
      description: Paste the output of `virgil-lsp --version`.
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How the server was installed
      options:
        - Release archive
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: Archive manifest or source revision
      description: |
        For a release archive, paste the `manifest.json` from its directory.
        For a build from source, give the commit (`git rev-parse HEAD`), say whether the checkout had local changes, and name any other Virgil checkout or compiler you built with (`VIRGIL`, `VIRGIL_V3C`).
      render: text
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options:
        - VS Code
        - VS Code with Remote-SSH
        - VS Code with Remote-WSL
        - Neovim
        - LazyVim
        - Other
        - Not editor-specific (command line)
    validations:
      required: true
  - type: input
    id: editor-version
    attributes:
      label: Editor and extension versions
      description: |
        Neovim: `nvim --version`. VS Code: `code --version`, and the extension's version in the Extensions view.
        Write "none" for a command-line problem.
      placeholder: "e.g. Neovim 0.11.6, LazyVim 15.x; or VS Code 1.142.0, extension 0.1.4"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform where the server runs
      description: With Remote-SSH, Remote-WSL, or Neovim over SSH, this is the remote machine or WSL, not the one showing the editor.
      options:
        - Linux x86-64
        - WSL 2 on Windows x86-64
        - macOS on Apple Silicon (Rosetta 2)
        - macOS on Intel
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system versions
      placeholder: "e.g. Ubuntu 24.04; macOS 15.5; Windows 11 with Ubuntu 24.04 in WSL 2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: |
        - VS Code: the "Virgil Language Server" output channel, which also holds the server's stderr. For LSP messages, set its log level to Trace with **Developer: Set Log Level...**.
        - Neovim: the LSP log, where the server's stderr appears as lines marked `"stderr"`. `:LspLog` opens it with nvim-lspconfig on Neovim 0.11; otherwise, as on Neovim 0.12, `:lua =vim.lsp.log.get_filename()` prints its path. For LSP messages, run `:lua vim.lsp.log.set_level("debug")` before reproducing the problem.
        - Command line: the command's stderr.

        Remove anything private before pasting.
      render: text
    validations:
      required: true
